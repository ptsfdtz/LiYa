<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>璃芽 · 全部单尾表情动画</title><style>
body{font:16px system-ui,sans-serif;background:#f5f2ea;color:#274c45;max-width:1100px;margin:32px auto;padding:0 20px}
h1{font-size:26px}p{line-height:1.7}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(192px,1fr));gap:16px}
figure{margin:0;border-radius:16px;background:#fffaf2;text-align:center;padding:12px 0}img{max-width:100%;height:auto}
figcaption{padding:8px 12px}small{display:block;line-height:1.6;color:#68817b;margin-top:6px;font-size:13px}
button{font:inherit;padding:10px 20px;margin-bottom:24px;border:1px solid #64877c;border-radius:8px;background:white;color:inherit;cursor:pointer}
</style><h1>璃芽 · 15 种单尾表情</h1><p>全部采用原造型的低位单尾。每种60帧、20 FPS、3秒循环；身体与尾巴随情绪变化一起动。</p>
<button id="toggle" type="button" aria-pressed="false">暂停全部动画</button><main><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="idle.png"><img src="idle.gif" width="192" height="208" alt="平静待机" data-state="idle"></picture><figcaption><strong>平静待机</strong><small>轻呼吸，尾尖缓慢摆动</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="happy.png"><img src="happy.gif" width="192" height="208" alt="开心" data-state="happy"></picture><figcaption><strong>开心</strong><small>轻轻晃身，尾巴欢快轻摆</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="curious.png"><img src="curious.gif" width="192" height="208" alt="好奇" data-state="curious"></picture><figcaption><strong>好奇</strong><small>微微歪身，尾尖轻抬</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="thinking.png"><img src="thinking.gif" width="192" height="208" alt="思考" data-state="thinking"></picture><figcaption><strong>思考</strong><small>托腮沉思，小幅缓慢摆尾</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="sulky.png"><img src="sulky.gif" width="192" height="208" alt="轻微不服气" data-state="sulky"></picture><figcaption><strong>轻微不服气</strong><small>抱臂轻晃，尾尖短幅摆动</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="caring.png"><img src="caring.gif" width="192" height="208" alt="关心倾听" data-state="caring"></picture><figcaption><strong>关心倾听</strong><small>温柔点头，尾巴轻缓跟随</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="greeting.png"><img src="greeting.gif" width="192" height="208" alt="欢迎" data-state="greeting"></picture><figcaption><strong>欢迎</strong><small>轻挥手，尾巴同步欢迎</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="sleepy.png"><img src="sleepy.gif" width="192" height="208" alt="困倦" data-state="sleepy"></picture><figcaption><strong>困倦</strong><small>缓缓低头，尾巴放松轻摆</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="excited.png"><img src="excited.gif" width="192" height="208" alt="兴奋庆祝" data-state="excited"></picture><figcaption><strong>兴奋庆祝</strong><small>小幅跳起，尾尖稍后跟随回落</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="shy.png"><img src="shy.gif" width="192" height="208" alt="害羞" data-state="shy"></picture><figcaption><strong>害羞</strong><small>含羞轻点头，尾尖含蓄轻摆</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="surprised.png"><img src="surprised.gif" width="192" height="208" alt="惊讶" data-state="surprised"></picture><figcaption><strong>惊讶</strong><small>小幅一惊后恢复，尾巴随动</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="worried.png"><img src="worried.gif" width="192" height="208" alt="担心" data-state="worried"></picture><figcaption><strong>担心</strong><small>担心轻晃，尾巴低幅摆动</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="sad.png"><img src="sad.gif" width="192" height="208" alt="低落" data-state="sad"></picture><figcaption><strong>低落</strong><small>安静低头，尾尖低垂轻摆</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="relieved.png"><img src="relieved.gif" width="192" height="208" alt="释然" data-state="relieved"></picture><figcaption><strong>释然</strong><small>放松呼吸，尾巴舒缓摆动</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="determined.png"><img src="determined.gif" width="192" height="208" alt="认真鼓劲" data-state="determined"></picture><figcaption><strong>认真鼓劲</strong><small>认真点头，尾巴稳稳跟随</small></figcaption></figure></main>
<script>const media=matchMedia('(prefers-reduced-motion: reduce)');let paused=media.matches;
const button=document.querySelector('#toggle');function update(){document.querySelectorAll('picture').forEach(p=>{p.querySelector('source').media=paused?'all':'not all'});
button.textContent=paused?'播放全部动画':'暂停全部动画';button.setAttribute('aria-pressed',String(paused))}
button.onclick=()=>{paused=!paused;update()};media.addEventListener('change',e=>{paused=e.matches;update()});update();</script></html>
