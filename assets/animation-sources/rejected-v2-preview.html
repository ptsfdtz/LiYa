<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>璃芽 · 表情动画预览</title><style>
body{font-family:system-ui,sans-serif;background:#f5f2ea;color:#274c45;margin:32px auto;max-width:1100px;padding:0 20px}
h1{font-size:26px}p{line-height:1.6}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(192px,1fr));gap:16px}
figure{margin:0;background:#fffaf2;border-radius:16px;text-align:center;padding:12px 0}small{display:block;color:#68817b}
button{padding:10px 20px;margin:0 0 24px;border:1px solid #64877c;border-radius:8px;background:white;color:#274c45;cursor:pointer}
img{max-width:100%;object-fit:contain}figcaption{padding-top:8px}</style>
<h1>璃芽 · 15 种表情</h1><p>每种 48 帧，20 FPS，2.4 秒循环。系统开启减少动态效果时，自动显示静态图。</p>
<button type="button" aria-pressed="false" id="toggle">暂停动画</button><main><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="idle.png"><img src="idle.gif" width="192" height="208" alt="平静待机" data-state="idle"></picture><figcaption>平静待机 <small>idle</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="happy.png"><img src="happy.gif" width="192" height="208" alt="开心" data-state="happy"></picture><figcaption>开心 <small>happy</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="curious.png"><img src="curious.gif" width="192" height="208" alt="好奇" data-state="curious"></picture><figcaption>好奇 <small>curious</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="thinking.png"><img src="thinking.gif" width="192" height="208" alt="思考" data-state="thinking"></picture><figcaption>思考 <small>thinking</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="sulky.png"><img src="sulky.gif" width="192" height="208" alt="轻微不服气" data-state="sulky"></picture><figcaption>轻微不服气 <small>sulky</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="caring.png"><img src="caring.gif" width="192" height="208" alt="关心倾听" data-state="caring"></picture><figcaption>关心倾听 <small>caring</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="greeting.png"><img src="greeting.gif" width="192" height="208" alt="欢迎" data-state="greeting"></picture><figcaption>欢迎 <small>greeting</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="sleepy.png"><img src="sleepy.gif" width="192" height="208" alt="困倦" data-state="sleepy"></picture><figcaption>困倦 <small>sleepy</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="excited.png"><img src="excited.gif" width="192" height="208" alt="兴奋庆祝" data-state="excited"></picture><figcaption>兴奋庆祝 <small>excited</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="shy.png"><img src="shy.gif" width="192" height="208" alt="害羞" data-state="shy"></picture><figcaption>害羞 <small>shy</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="surprised.png"><img src="surprised.gif" width="192" height="208" alt="惊讶" data-state="surprised"></picture><figcaption>惊讶 <small>surprised</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="worried.png"><img src="worried.gif" width="192" height="208" alt="担心" data-state="worried"></picture><figcaption>担心 <small>worried</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="sad.png"><img src="sad.gif" width="192" height="208" alt="低落" data-state="sad"></picture><figcaption>低落 <small>sad</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="relieved.png"><img src="relieved.gif" width="192" height="208" alt="释然" data-state="relieved"></picture><figcaption>释然 <small>relieved</small></figcaption></figure><figure><picture><source media="(prefers-reduced-motion: reduce)" srcset="determined.png"><img src="determined.gif" width="192" height="208" alt="认真鼓劲" data-state="determined"></picture><figcaption>认真鼓劲 <small>determined</small></figcaption></figure></main>
<script>let paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
const button=document.querySelector('#toggle');
function update(){document.querySelectorAll('picture').forEach(p=>{p.querySelector('source').srcset=p.querySelector('img').dataset.state+'.png';
p.querySelector('source').media=paused?'all':'not all';});button.textContent=paused?'播放动画':'暂停动画';button.setAttribute('aria-pressed',String(paused));}
button.onclick=()=>{paused=!paused;update()};matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{paused=e.matches;update()});update();</script></html>
