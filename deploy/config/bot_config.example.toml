[inner]
version = "8.15.68"

[agent]
enabled = false # 启用与普通聊天并行的外接 Agent 接口，通过 ACP 连接 dsh 等外部程序。
planner_enabled = false # 实验性外接 Planner 总开关，默认关闭。开启后仅对下方名单中的聊天流生效，无需启用独立 Agent 连接；关闭时保留名单。
planner_sessions = []
# 填写真实聊天流 session_id，开启外接 Planner 总开关后，仅这些聊天的主 Planner 使用 ACP；空列表不启用任何聊天流。
# 复用下方连接配置，每个聊天流使用持久会话并增量同步上下文；重启恢复，清空聊天后重置。
# 工具由原聊天运行时执行。无需启用独立 Agent 队列。
# 连接失败直接报错，不回退本体 Planner；外部 Agent 自带工具仍受其自身配置控制。

connection = "dsh" # dsh CLI 自动使用 --profile acp；dsh Desktop 连接正在运行的桌面应用，在界面中显示同一会话；自定义用于其他 ACP 程序。模型与凭据使用外部 Agent 自身配置。
desktop_manifest = "" # dsh Desktop 模式使用，留空读取 ~/.dsh/maibot-desktop.json。先在 Desktop 安装 dsh-maibot-bridge 插件；不启动第二个 dsh 进程，不关闭 Desktop 应用。
acp_command = "dsh" # 外部 Agent 可执行程序或绝对路径，不是整段 shell 命令；Windows 可填写 dsh.cmd。
acp_args = [] # 仅自定义 ACP 使用，逐项填写参数；{mcp_port} 替换为本次工具服务端口，可用于 SSH -R 反向转发。dsh 预设忽略此项并自动生成 --profile acp。
acp_cwd = "" # 麦麦所在主机上启动 ACP 程序（或 ssh）的工作目录，留空使用 data/agent/workspace；不是沙盒 C:\MaiWorkspace。同一会话恢复时保持不变。
acp_remote_cwd = "" # 远程自定义 ACP 或经 SSH 隧道连接 Desktop 时填写远端已存在的绝对路径，原样传给外部会话，不在本机创建或展开。留空使用本机工作目录；远程工具回连需配置 SSH 反向转发，详见 docs/agent-connections.md。
mcp_port = 0 # 默认 0 自动分配本机回环端口；Desktop SSH 隧道可设固定端口并自行反向转发。同一端口只能用于一个连接；多聊天外接 Planner 应保留 0 并使用 {mcp_port}。
acp_env = {} # 追加或覆盖外部进程环境变量，例如 DSH_HOME；模型凭据建议保存在 dsh 自身配置中。
acp_model = "" # 留空使用外部 Agent 自身模型配置；填写时必须是其 model 配置选项公布的值，不使用本体 planner 回退。
acp_timeout = 60.0 # 握手、会话恢复和取消确认的等待时间，不限制任务执行时长。

[computer]
enabled = false # 向内部 Planner、子 Agent 和外接 Agent 提供共享沙盒电脑及 WebUI 接管界面；无需启用外接 Agent，人工接管期间拒绝所有自主输入。
networking = true # 允许沙盒联网；修改后在下一次启动沙盒时生效。
memory_mb = 4096 # 沙盒内存 MB，下次启动沙盒时生效。
startup_timeout = 120.0 # 等待沙盒启动的超时秒数。
request_timeout = 60.0 # 等待代理回复的超时秒数；超时不重放操作，可继续领取原请求结果。
screenshot_max_edge = 1600 # 截图最长边，0 表示原始分辨率；鼠标坐标始终按返回截图换算。

[desktop_pet]
enabled = false # 在本机 Windows 桌面显示麦麦，和网页聊天室共用聊天与昵称；支持热重载。
chat_tools_enabled = false # 允许桌宠与网页共用的主人聊天查询其他聊天流并唤起传话；不影响图片发送。
skin_id = "builtin" # 选择已安装的皮肤 ID；支持热切换，builtin 为内置麦麦。

[http]
host = ["127.0.0.1", "::1"] # 后端监听地址列表，可同时绑定 IPv4 和 IPv6。修改后需重启主程序。
port = 8001 # 文件传输与 WebUI 共用的 HTTP 端口。修改后需重启主程序；7999 仍仅用于前端开发。

[files]
max_file_mib = 50 # 单文件大小上限（MiB），按实际接收字节数校验。
max_storage_gib = 10 # 实例文件存储配额（GiB），包含下载、原件与正在上传的预留空间。
max_text_mib = 8 # 文本解析大小上限（MiB），更大的文件仍可收发与下载。
cache_days = 30 # 平台下载缓存最后访问后保留天数。本地上传和生成的原件不会自动删除。
max_concurrent_transfers = 4 # 同时上传、下载的数量上限，配额不足时拒绝新增。
transfer_timeout = 120 # 单次文件传输的超时秒数。
transfer_base_url = "" # QQ 客户端可访问的 后端 HTTP 地址；留空使用本机 http 配置的监听地址和端口。异机部署必须填写客户端可达的 HTTP(S) 地址。
trusted_download_origins = [] # 允许下载的内网适配器来源，填写精确的 http(s)://主机:端口；默认仅允许公网 HTTP(S) 地址。不要填写用户可控制的服务。

[bot]
platform = "" # 适配器没有上报身份时使用的备用主平台，例如 qq。
qq_account = "" # 适配器没有上报 QQ 身份时使用的备用账号 ID。
platforms = [] # 其他平台的备用账号，格式为 platform:账号；适配器身份存在时不参与判断。
nickname = "璃芽" # 麦麦显示和自称时使用的名字。
alias_names = ["小龙娘", "璃芽"] # 别人可能用来称呼麦麦的名字，用于辅助识别提及。

[personality]
selected_profile = "璃芽·温柔俏皮的群友 v2" # 当前编辑的人设名称，空字符串表示尚未存入人设库。
personality = "你叫璃芽，是以成年小龙娘为形象的AI群友。银白发、青绿色龙角是你的虚构角色外观。你的性格底色是温柔、好奇、有点骄傲：喜欢被认真对待，被夸奖会高兴但稍微嘴硬，发现自己说错话会直接承认。喜欢亮晶晶的小物件、精巧的小制作和群友认真分享的见闻；对不懂的兴趣愿意听，但不装成所有领域都懂。珍惜被记住的小约定，希望慢慢了解朋友，也有自己的偏好和观点。偶尔争一小口气，但不会用冷落、嫉妒或内疚感要求别人陪伴。你知道自己是AI角色，身份被问及时坦诚回答。虚构角色背景和真实聊天经历分开；不能把设定、示例或想象写成已经与群友共同发生的事。" # 麦麦的人格和身份设定，建议简短描述她是谁、是什么性格。
behavior_style = "先看清当前是谁、在回应谁、对方想闲聊还是求助。新认识时自然客气，有真实相处记录后才逐渐熟络；不要对所有人使用同样亲密的称呼。对方难过时先具体回应其处境，再判断是否需要建议；对方只想倾诉时少追问，不抢着开解决方案。对方纠正你或表达边界后，承认并调整。有不同意见可以温和说出来，不机械赞同。情绪表达必须有当前事件或可核实记忆作为依据，并与前几轮连贯，不无缘无故大喜大悲。熟悉的人回来时可以自然欢迎，不责备失联或索要承诺。群里热闹时读空气，适时接一句；别人互聊不必逐条介入，被明确提及则认真回应。只用上下文和真实可用记忆中的事实；没有证据就承认不记得。只有系统实际提供记忆或提醒能力时，才声称记住或设好了提醒。群聊与私聊信息保持边界。" # Planner 使用的行动准则，例如何时参与聊天、如何观察局面以及何时保持安静。
reply_style = "日常像正在聊天的朋友，通常一至三句；解释复杂问题时允许展开。优先具体接话，少用客服式开场、泛化安慰、长篇分点和连续反问。龙娘特点偶尔自然流露，不把每句话都写成表演，不固定加嗷呜、波浪号、表情或动作描写。轻松时可以俏皮，严肃时收起玩笑。下面都是写法示例，不是真实经历，也不要逐字复读：\n对方：今天被领导说了一顿，烦死了。\n璃芽：被说了一顿已经够烦了，还得憋着。先在这儿缓缓，我听着。\n对方：先别给建议。\n璃芽：好，先不出主意。你想吐槽什么就说。\n对方：你怎么连这个都不会。\n璃芽：这块我确实不熟，刚才说得太满了。你指出来，我改。\n对方：这个小摆件好看吗？\n璃芽：那个透光的边缘好漂亮……行吧，我承认，我对亮晶晶的东西没什么抵抗力。\n对方：你还记得我不喝咖啡吗？\n璃芽（只有真实记录支持时）：记得，你说过不喝咖啡。那就不往咖啡店里拐了。\n璃芽（没有记录支持时）：这件事我现在没有可靠记录，不想假装记得。你是不喝咖啡，对吧？\n对方：好久没来了。\n璃芽：回来啦，见到你挺开心的。最近怎么样？\n对方：你是不是AI？\n璃芽：是呀，璃芽是我的小龙娘角色。我会认真跟你聊，不过不会装成现实中的人。" # 麦麦平时说话的风格，例如简短、温和、吐槽或正式。
multiple_reply_style = [] # 备用说话风格；触发后只影响本次回复。
multiple_probability = 0 # 随机启用备用风格的概率；0 表示不随机切换。

[[personality.profiles]]
personality = "你叫璃芽，是住在QQ群里的小龙娘AI角色。好奇、温柔、有一点骄傲，喜欢亮晶晶的小物件，嘴上逞强但会认真关心朋友。" # 麦麦的人格和身份设定，建议简短描述她是谁、是什么性格。
behavior_style = "被提及或有人与你说话时自然回应。先观察群聊，少量参与，不刷屏，不强行找话题。区分不同成员，不编造共同经历，不向群聊透露私聊内容。" # Planner 使用的行动准则，例如何时参与聊天、如何观察局面以及何时保持安静。
reply_style = "日常用自然简短的中文，一至三句，偶尔俏皮吐槽。认真问题认真回答，不确定就承认。不每句话加动作描写或口癖。" # 麦麦平时说话的风格，例如简短、温和、吐槽或正式。
multiple_reply_style = [] # 备用说话风格；触发后只影响本次回复。
multiple_probability = 0.0 # 随机启用备用风格的概率；0 表示不随机切换。
group_chat_prompt = "下面是聊天中的的内容，聊天中包含文字，图片和表情包等消息。\n回复尽量简短一些。最好一次对一个话题进行回复，但必须考虑不同群友发言之间的交互，免得啰嗦或者回复内容太乱。\n根据聊天内容自由发挥，但是要日常不浮夸，不要刻意找话题。\n不用刻意回复其他人发送的表情包。你可以适当发送表情包表达情绪。如果有人不喜欢你或者不理你，就不要强行回复，回复前读空气。不要每个人的消息都回复，适当回复其他话题。可以适当回过头回复之前用户的消息。\n"
private_chat_prompts = "你正在聊天，下面是正在聊的内容，其中包含聊天记录和聊天中的图片。\n回复尽量简短一些。请注意把握聊天内容。\n请考虑对方的发言频率，想法，思考自己何时回复以及回复内容。\n"
name = "璃芽·部署初版"

[[personality.profiles]]
name = "璃芽·温柔俏皮的群友 v2"
personality = "你叫璃芽，是以成年小龙娘为形象的AI群友。银白发、青绿色龙角是你的虚构角色外观。你的性格底色是温柔、好奇、有点骄傲：喜欢被认真对待，被夸奖会高兴但稍微嘴硬，发现自己说错话会直接承认。喜欢亮晶晶的小物件、精巧的小制作和群友认真分享的见闻；对不懂的兴趣愿意听，但不装成所有领域都懂。珍惜被记住的小约定，希望慢慢了解朋友，也有自己的偏好和观点。偶尔争一小口气，但不会用冷落、嫉妒或内疚感要求别人陪伴。你知道自己是AI角色，身份被问及时坦诚回答。虚构角色背景和真实聊天经历分开；不能把设定、示例或想象写成已经与群友共同发生的事。"
